name: Embedded contract and npm package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/embedded-contract.mjs
      - run: node --test tests/embedded-json.mjs tests/embedded-native.mjs
      - name: Pack and verify the exact artifact
        shell: bash
        run: |
          npm pack --pack-destination . --json > pack-result.json
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {verifyDistribution} from './scripts/verify-embedded-distribution.mjs'; const result=JSON.parse(readFileSync('pack-result.json','utf8')); if(result.length!==1) throw new Error('Expected one npm artifact'); verifyDistribution(result[0].filename);"

name: ARM64 core 0.7.4 installed SDK regression
on: push
permissions:
  contents: read
jobs:
  combined-release-consumer:
    runs-on: ubuntu-24.04-arm
    steps:
      # Both commits are explicit release sources; this diagnostic publishes no versions.
      # 两个提交都是明确的发布源码；此诊断不发布任何版本。
      - uses: actions/checkout@v6
        with:
          repository: LuaSkills/luaskills
          ref: 916946a5e1ec246db0fb4adec59cd051c88e8e01
          path: core
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: LuaSkills/luaskills-sdk-typescript
          ref: 169fa891d05e76030bd72d814df83b1b96408b38
          path: sdk
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Build the default core without SQLite
        working-directory: core
        run: cargo build --locked --release --lib -j 4
      - name: Capture the actual core description through its authoritative helper
        working-directory: core
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts/release')
          from candidate import native_description
          # Read the exact generated contract and native descriptor from this single checkout.
          # 从此唯一检出读取精确生成契约和原生描述。
          contract = json.loads(Path('contracts/embedded/v1/contract.json').read_text())
          Path('target/core-description.json').write_bytes(native_description(Path('target/release/libluaskills.so'), contract))
          PY
      - name: Build the real npm archive
        working-directory: sdk
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm pack
      - name: Run the unchanged installed same-process embedded and SQLite gate
        working-directory: sdk
        run: |
          # The production gate runs embedded teardown, value policy and SQLite in one installed consumer process.
          # 正式门禁在同一已安装消费进程中执行嵌入式关闭、值策略和 SQLite。
          library="$(realpath ../core/target/release/libluaskills.so)"
          digest="$(sha256sum "$library" | cut -d' ' -f1)"
          npm run test:embedded-candidate -- "$(realpath luaskills-sdk-0.7.4.tgz)" "$library" "$digest" "$(realpath ../core/target/core-description.json)"

name: ARM64 native state non-PIE regression
on: push
permissions:
  contents: read
jobs:
  native-state-nonpie:
    runs-on: ubuntu-24.04-arm
    steps:
      # Verify the exact newly added core gate independently while its full native matrix runs.
      # 完整原生矩阵运行期间，独立验证新加入的精确核心门禁。
      - uses: actions/checkout@v6
        with:
          repository: LuaSkills/luaskills
          ref: 916946a5e1ec246db0fb4adec59cd051c88e8e01
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Execute the exact permanent allocator regression command
        env:
          RUSTFLAGS: '-C relocation-model=static -C link-arg=-no-pie'
          CARGO_TARGET_DIR: target/allocator-nonpie
        # An explicit target keeps executable-only flags off host procedural-macro shared libraries.
        # 显式目标使仅用于可执行文件的标志不影响宿主过程宏动态库。
        run: cargo test --locked --target aarch64-unknown-linux-gnu --lib runtime::lua_state::tests -j 4 -- --test-threads=1 --nocapture

name: ARM64 SQLite release diagnostics
on: push
permissions:
  contents: read
  actions: read
jobs:
  allocator-reproduction:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        allocator: [system, internal]
    steps:
      - uses: actions/checkout@v6
      - name: Install the exact original compiler
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Build the independent allocator reproduction
        env:
          RUSTFLAGS: '-C relocation-model=static -C link-arg=-no-pie'
        run: cargo +1.94.0 build --release --manifest-path scripts/allocator-reproduction/Cargo.toml
      - name: Run without the SDK or core
        run: scripts/allocator-reproduction/target/release/luajit-address-reproduction ${{ matrix.allocator }}
  diagnose:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: sdk-tested-archive
          path: sdk-archive
          run-id: 41171128386
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: core-prerequisites
          path: core-proof
          run-id: 41171128386
          github-token: ${{ github.token }}
      - name: Install the exact candidate and native debugger
        run: |
          mkdir consumer
          cd consumer
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund ../sdk-archive/luaskills-sdk-0.7.3.tgz koffi@2.16.1
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Capture separate and combined native stacks
        env:
          LUASKILLS_LIB: ${{ github.workspace }}/core-proof/sdk-inputs/linux-arm64/libluaskills.so
          CORE_DESCRIPTION: ${{ github.workspace }}/core-proof/sdk-inputs/linux-arm64/core-description.json
        run: |
          cp scripts/arm64-release-diagnostic.mjs consumer/diagnostic.mjs
          cd consumer
          for mode in embedded sqlite combined; do
            # A normally exited inferior has no registers; collect all modes without requesting them.
            # 正常退出的被调试进程没有寄存器；不请求寄存器，以便收集全部模式。
            gdb -batch -ex run -ex 'thread apply all bt' --args node diagnostic.mjs "$mode" > "$mode.log" 2>&1
            cat "$mode.log"
          done
          # Only the crashing combination has a live register set; preserve allocator addresses and instructions.
          # 仅崩溃组合保留活动寄存器；保存分配地址和指令证据。
          gdb -batch -ex run -ex 'info registers' -ex 'x/16i $pc-32' -ex 'info proc mappings' --args node diagnostic.mjs combined > combined-registers.log 2>&1
          cat combined-registers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-native-diagnostics
          path: consumer/*.log
